<!doctype html>
<html lang="ja">
<head>

  <title>Talk Coach Overlay</title>
  <link rel="stylesheet" href="talk-coach-overlay.css">
</head>
<body>
  <main id="overlay" class="overlay">
    <span class="overlay__label">TALK COACH</span>

    <small id="coachStatus">OFF</small>
  </main>
  <script src="talk-coach-bridge.js"></script>
  <script src="talk-coach-overlay.js"></script>
</body>
</html>
