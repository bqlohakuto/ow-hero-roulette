<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#101729" />
  <title>OW ヒーロールーレット</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="screen-bg" aria-hidden="true"></div>
  <main class="app-shell">
    <header class="top-header">
      <div>
        <p class="eyebrow">カスタムヒーローピック</p>
        <h1>チームを編成</h1>
        <p class="subtitle">ランダムヒーロールーレット / 1〜6人 / ヒーローBAN</p>
      </div>
      <button id="openBanBtn" class="ban-open" type="button" aria-haspopup="dialog">
        <span class="ban-open__mark">⊘</span>
        <span><small>ヒーローBAN</small><strong><span id="banCount">0</span> BAN中</strong></span>
      </button>
    </header>

    <section class="control-bar" aria-label="抽選設定">
      <div class="control-unit">
        <span class="control-label">プレイヤー人数</span>
        <div class="stepper">
          <button id="minusPlayer" type="button" aria-label="人数を減らす">−</button>
          <strong id="playerCount">5</strong>
          <button id="plusPlayer" type="button" aria-label="人数を増やす">＋</button>
        </div>
      </div>

      <div class="control-unit preset-unit">
        <span class="control-label">ロールプリセット</span>
        <div class="preset-row">
          <button type="button" class="preset-btn active" data-preset="5v5">5v5</button>
          <button type="button" class="preset-btn" data-preset="6v6">6v6</button>
          <button type="button" class="preset-btn" data-preset="free">フリー</button>
        </div>
      </div>

      <div class="availability">
        <span class="control-label">使用可能ヒーロー</span>
        <strong><span id="availableCount">53</span><em>/</em><span id="heroTotal">53</span></strong>
      </div>
    </section>

    <section class="team-stage">
      <div class="team-stage__label">
        <span>あなたのチーム</span>
        <span id="teamHint">ロールを選んで抽選</span>
      </div>
      <div class="player-scroll">
        <section id="playerGrid" class="player-grid" aria-live="polite"></section>
      </div>
    </section>

    <section class="action-zone">
      <button id="spinAllBtn" class="spin-button" type="button">
        <span class="spin-button__flare"></span>
        <small>ランダムピック</small>
        <strong>抽選</strong>
      </button>
      <button id="clearResultsBtn" class="secondary-button" type="button">結果をリセット</button>
    </section>

    <footer>
      <p>ファンメイドのツールです。ヒーロー画像にはオリジナルのシンボルアイコンを使用しています。</p>
    </footer>
  </main>

  <dialog id="banDialog" class="ban-dialog">
    <form method="dialog" class="ban-screen">
      <div class="ban-screen__backdrop" aria-hidden="true"></div>

      <header class="ban-header">
        <div class="ban-header__side">
          <span class="accent-line"></span>
          <div>
            <p class="ban-kicker">カスタムマッチ</p>
            <h2>ヒーローBAN</h2>
            <p class="ban-description">抽選対象から外すヒーローを選択</p>
          </div>
        </div>

        <div class="ban-header__status">
          <span>BAN中</span>
          <strong id="modalBanCount">0</strong>
        </div>

        <button class="close-ban" value="cancel" aria-label="閉じる">×</button>
      </header>

      <div class="ban-toolbar">
        <label class="hero-search">
          <span>⌕</span>
          <input id="heroSearch" type="search" placeholder="ヒーロー検索" autocomplete="off" />
        </label>
        <p>タイルをタップして BAN / もう一度タップで解除</p>
      </div>

      <section id="banHeroGrid" class="hero-select-board"></section>

      <footer class="ban-footer">
        <button id="clearBanBtn" type="button" class="ow-button ow-button--light">BANをリセット</button>
        <button id="banVisibleBtn" type="button" class="ow-button ow-button--dark">表示中をすべてBAN</button>
        <button class="ow-button ow-button--ready" value="default">完了</button>
      </footer>
    </form>
  </dialog>

  <template id="playerCardTemplate">
    <article class="player-card">
      <div class="player-card__number"></div>
      <label class="player-name-wrap">
        <span class="sr-only">プレイヤー名</span>
        <input class="player-name" type="text" maxlength="18" />
      </label>

      <div class="result-stage role-all">
        <div class="hero-portrait">
          <div class="hero-emblem" aria-hidden="true"><span>?</span></div>
          <div class="scan-line" aria-hidden="true"></div>
        </div>
        <div class="hero-info">
          <span class="role-label">待機</span>
          <strong class="hero-name">—</strong>
          <small class="hero-sub">待機中</small>
        </div>
      </div>

      <select class="role-select" aria-label="ロール選択">
        <option value="all">全ロール</option>
        <option value="tank">タンク</option>
        <option value="damage">ダメージ</option>
        <option value="support">サポート</option>
      </select>

      <button class="reroll-button" type="button">↻ 再抽選</button>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
